services:
  app:
    build: .
    ports:
      - "5001:8000"
    volumes:
      - ./downloads:/app/downloads
    env_file:
      - .env
    environment:
      MAX_TRACKS_PER_PLAYLIST: "50"
      DOWNLOAD_DIR: downloads
      DOWNLOAD_RETRIES: "2"   # tentativas extras em erros transitórios por faixa
      # HOME é definido pelo entrypoint (após o gosu), não aqui.
      # O entrypoint sobe como root, faz chown da pasta downloads para PUID:PGID
      # (corrige arquivos antigos criados como root) e dropa o privilégio via gosu.
      # Ajuste no .env se seu usuário não for 1000:1000 (veja com `id -u` / `id -g`).
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    restart: unless-stopped
