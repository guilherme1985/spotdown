services:
  app:
    build: .
    ports:
      - "5001:8000"
    volumes:
      - ./downloads:/app/downloads
    env_file:
      - .env
    environment:
      MAX_TRACKS_PER_PLAYLIST: "50"
      DOWNLOAD_DIR: downloads
      SPOTIFY_REDIRECT_URI: "http://localhost:5001/callback"
    restart: unless-stopped
