<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotDownload</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231DB954'/%3E%3Cpath d='M12 4v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V8h4V4h-6z' fill='%23000'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                SpotDownload
            </div>
            <div id="auth-indicator" class="auth-indicator hidden"></div>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <h1>Baixe sua playlist do Spotify</h1>
            <p>Cole o link da playlist e acompanhe o download em tempo real</p>
        </section>

        <!-- Shown when NOT authenticated -->
        <section id="connect-section" class="connect-section hidden">
            <p class="connect-desc">Para começar, conecte sua conta Spotify.</p>
            <a href="/auth/login" class="btn-spotify">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                </svg>
                Conectar com Spotify
            </a>
        </section>

        <!-- Shown when authenticated -->
        <section id="form-section" class="form-section hidden">
            <form id="form" class="form">
                <input
                    id="url-input"
                    class="url-input"
                    type="text"
                    placeholder="https://open.spotify.com/playlist/..."
                    autocomplete="off"
                    spellcheck="false"
                />
                <button type="submit" id="submit-btn" class="btn-primary">Baixar</button>
            </form>
            <p class="form-hint" id="limit-hint"></p>
        </section>

        <div id="jobs-toolbar" class="jobs-toolbar hidden">
            <button class="btn-clear-history" onclick="clearHistory()">Limpar histórico</button>
        </div>

        <section id="jobs" class="jobs-section"></section>
    </main>

    <footer class="footer">SpotDownload v1.5</footer>

    <script src="app.js"></script>
</body>
</html>
