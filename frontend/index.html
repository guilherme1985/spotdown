<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotDownload</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231DB954'/%3E%3Cpath d='M12 4v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V8h4V4h-6z' fill='%23000'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
                SpotDownload
            </div>
            <div class="header-right">
                <span id="spotify-status" class="spotify-status"></span>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <h1>Baixe sua playlist do Spotify</h1>
            <p>Cole o link da playlist e acompanhe o download em tempo real</p>
        </section>

        <section class="form-section">
            <form id="form" class="form">
                <input
                    id="url-input"
                    class="url-input"
                    type="text"
                    placeholder="https://open.spotify.com/playlist/..."
                    autocomplete="off"
                    spellcheck="false"
                />
                <button type="submit" id="submit-btn" class="btn-primary">Baixar</button>
                <button type="button" class="btn-settings" id="settings-btn" onclick="toggleSettings()" title="Configurações de nome">⚙</button>
            </form>
            <p class="form-hint" id="limit-hint"></p>

            <div id="settings-panel" class="settings-panel hidden">
                <div class="settings-label">Formato do nome do arquivo</div>
                <div class="settings-variables">
                    <span class="var-chip" onclick="insertVar('{artist}')">+ {artist}</span>
                    <span class="var-chip" onclick="insertVar('{name}')">+ {name}</span>
                    <span class="var-chip" onclick="insertVar('{album}')">+ {album}</span>
                    <span class="var-chip" onclick="insertVar('{number}')">+ {number}</span>
                    <span class="var-chip" onclick="insertVar('{releaseDate}')">+ {releaseDate}</span>
                </div>
                <div class="settings-input-row">
                    <input id="template-input" class="template-input" type="text" spellcheck="false" />
                    <button type="button" class="btn-reset-template" onclick="resetTemplate()">Padrão</button>
                </div>
                <div class="settings-preview" id="template-preview"></div>

                <div class="settings-divider"></div>

                <div class="settings-label">Limite de faixas por playlist</div>
                <div class="settings-limit-row">
                    <input id="limit-input" class="limit-input" type="number" min="1" max="500" />
                    <span class="limit-hint-text">faixas (máx. 500)</span>
                </div>

                <div class="settings-divider"></div>

                <label class="settings-check">
                    <input id="select-tracks-input" type="checkbox" />
                    <span>Escolher faixas antes de baixar</span>
                </label>
            </div>
        </section>

        <div class="generate-toggle-row">
            <button type="button" class="btn-generate-toggle" id="generate-toggle-btn" onclick="toggleGenerate()">
                ✦ Gerar por artista ou mood
            </button>
        </div>

        <section id="generate-panel" class="settings-panel hidden">
            <div class="settings-label">Gerar Playlist</div>
            <div class="segmented-control" id="query-type-control">
                <button class="seg-btn active" data-type="artist" onclick="selectQueryType(this)">Artista</button>
                <button class="seg-btn" data-type="album"  onclick="selectQueryType(this)">Álbum</button>
                <button class="seg-btn" data-type="mood"   onclick="selectQueryType(this)">Mood / Gênero</button>
            </div>
            <div class="settings-input-row" id="generate-input-row" style="margin-top:12px;">
                <input
                    id="generate-input"
                    class="url-input"
                    type="text"
                    placeholder="Ex: Coldplay"
                    autocomplete="off"
                    spellcheck="false"
                    onkeydown="if(event.key==='Enter'){submitGenerate();}"
                />
                <button type="button" class="btn-primary" id="generate-btn" onclick="submitGenerate()">Buscar e Baixar</button>
            </div>
            <p id="generate-hint" class="generate-hint hidden"></p>

            <div id="playlist-picker" class="hidden">
                <div class="picker-header">
                    <span>Escolha uma playlist:</span>
                    <button type="button" class="btn-picker-back" onclick="hidePicker()">← Voltar</button>
                </div>
                <div id="playlist-results" class="playlist-results"></div>
            </div>
        </section>

        <div id="jobs-toolbar" class="jobs-toolbar hidden">
            <button class="btn-retry-all" id="retry-all-btn" onclick="retryAllFailed()">Retentar falhas</button>
            <button class="btn-clear-history" onclick="clearHistory()">Limpar histórico</button>
        </div>

        <section id="jobs" class="jobs-section"></section>
    </main>

    <footer class="footer">SpotDownload v4.5</footer>

    <script src="app.js"></script>
</body>
</html>
